version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install -g pnpm@10
        - pnpm install --frozen-lockfile
    build:
      commands:
        # Amplify exposes console environment variables to the build, but not to
        # the server runtime where API routes execute. Writing them into
        # .env.production is the documented way to carry them across; the file is
        # created at build time and never committed.
        - env | grep -e '^NTFY_TOPIC=' >> .env.production || true
        - pnpm build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
